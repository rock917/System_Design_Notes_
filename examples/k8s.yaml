# Teaching manifest for a LOCAL cluster. Build/load shopstream-inference:local first.
# Create Secret shopstream-demo-key with key api-key in the same namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shopstream-settings
data:
  APP_ENV: "local-lab"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopstream-inference
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: shopstream-inference
  template:
    metadata:
      labels:
        app: shopstream-inference
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: shopstream-inference:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: shopstream-settings
          env:
            - name: DEMO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: shopstream-demo-key
                  key: api-key
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: shopstream-inference
spec:
  type: ClusterIP
  selector:
    app: shopstream-inference
  ports:
    - port: 80
      targetPort: http
---
# Requires a metrics API. CPU utilization is relative to requested CPU.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shopstream-inference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shopstream-inference
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
