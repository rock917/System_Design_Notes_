<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="100%" height="100%" fill="white"/><text x="600" y="45" font-family="Arial,sans-serif" font-size="30" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Why a queue grows under sustained overload</text><rect x="70.0" y="195.0" width="300" height="110" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="220" y="250.0" font-family="Arial,sans-serif" font-size="23" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Arrival: 120 jobs/s</text><rect x="830.0" y="195.0" width="300" height="110" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="980" y="250.0" font-family="Arial,sans-serif" font-size="23" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Service: 100 jobs/s</text><polyline points="380,250 810,250" fill="none" stroke="#536776" stroke-width="3"/><polygon points="810,250 797.3937405670625,256.08951747755725 797.3937405670625,243.91048252244278" fill="#536776"/><rect x="132.5" y="427.5" width="75" height="85" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="170" y="470.0" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">1</text><rect x="226.5" y="427.5" width="75" height="85" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="264" y="470.0" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">2</text><rect x="320.5" y="427.5" width="75" height="85" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="358" y="470.0" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">3</text><rect x="414.5" y="427.5" width="75" height="85" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="452" y="470.0" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">4</text><rect x="508.5" y="427.5" width="75" height="85" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="546" y="470.0" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">5</text><rect x="602.5" y="427.5" width="75" height="85" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="640" y="470.0" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">6</text><rect x="696.5" y="427.5" width="75" height="85" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="734" y="470.0" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">7</text><rect x="790.5" y="427.5" width="75" height="85" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="828" y="470.0" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">8</text><rect x="884.5" y="427.5" width="75" height="85" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="922" y="470.0" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">9</text><rect x="978.5" y="427.5" width="75" height="85" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="1016" y="470.0" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">10</text><text x="600" y="590" font-family="Arial,sans-serif" font-size="25" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Backlog grows by 20 jobs/s while these rates persist.</text><text x="600" y="640" font-family="Arial,sans-serif" font-size="21" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">A 1000-job empty buffer buys about 50 seconds in the continuous model.</text></svg>