<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="100%" height="100%" fill="white"/><text x="600" y="45" font-family="Arial,sans-serif" font-size="30" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Envelope encryption separates data and key protection</text><rect x="90.0" y="165.0" width="420" height="130" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="300" y="230.0" font-family="Arial,sans-serif" font-size="27" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Data encrypted by data key</text><rect x="690.0" y="165.0" width="420" height="130" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="900" y="215.0" font-family="Arial,sans-serif" font-size="25" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Data key wrapped by key-</text><text x="900" y="245.0" font-family="Arial,sans-serif" font-size="25" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">encryption key</text><rect x="175.0" y="460.0" width="850" height="140" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="600" y="513.5" font-family="Arial,sans-serif" font-size="28" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Store ciphertext + wrapped key; control key access</text><text x="600" y="546.5" font-family="Arial,sans-serif" font-size="28" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">separately</text><polyline points="300,295 300,440 500,460" fill="none" stroke="#536776" stroke-width="3"/><polygon points="500,460 486.8503733987314,464.80492666408236 488.06223267085204,452.686333942876" fill="#536776"/><polyline points="900,295 900,440 700,460" fill="none" stroke="#536776" stroke-width="3"/><polygon points="700,460 711.937767329148,452.686333942876 713.1496266012686,464.80492666408236" fill="#536776"/></svg>