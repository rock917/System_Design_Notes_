<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="100%" height="100%" fill="white"/><text x="600" y="45" font-family="Arial,sans-serif" font-size="30" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Connection ownership and bounded waiting</text><rect x="140.0" y="230.0" width="240" height="140" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="260" y="300.0" font-family="Arial,sans-serif" font-size="24" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Connection 1</text><rect x="480.0" y="230.0" width="240" height="140" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="600" y="300.0" font-family="Arial,sans-serif" font-size="24" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Connection 2</text><rect x="820.0" y="230.0" width="240" height="140" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="940" y="300.0" font-family="Arial,sans-serif" font-size="24" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Connection 3</text><rect x="190.0" y="500.0" width="820" height="100" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="600" y="550.0" font-family="Arial,sans-serif" font-size="26" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Additional callers wait only within a bounded deadline</text><text x="600" y="140" font-family="Arial,sans-serif" font-size="25" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Pool size limits simultaneous ownership, not total requests.</text></svg>