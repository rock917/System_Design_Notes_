text><text x="600" y="680" font-family="Arial,sans-serif" font-size="21" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Numbered connections: source -&gt; destination | message or responsibility</text><text x="70" y="720" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">1. Client -&gt; Auth + cost admission | input</text><text x="70" y="756" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">2. Auth + cost admission -&gt; Versioned cache | permitted lookup</text><text x="70" y="792" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">3. Auth + cost admission -&gt; Bounded queue / batcher | admit</text><text x="70" y="828" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">4. Bounded queue / batcher -&gt; Model workers | compatible batch</text><text x="70" y="864" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">5. Artifact registry -&gt; Model workers | verified model (control / failure)</text><text x="70" y="900" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">6. Model workers -&gt; Usage ledger | actual usage</text><text x="70" y="936" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">7. Model workers -&gt; Quality evaluation | approved evaluation (control / failure)</text></svg>