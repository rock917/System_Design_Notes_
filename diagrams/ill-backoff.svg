<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="100%" height="100%" fill="white"/><text x="600" y="45" font-family="Arial,sans-serif" font-size="30" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Exponential retry windows with full jitter</text><text x="200" y="190" font-family="Arial,sans-serif" font-size="24" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Retry 1</text><polyline points="350,190 425.0,190" fill="none" stroke="#167D8D" stroke-width="18"/><text x="990" y="190" font-family="Arial,sans-serif" font-size="24" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">0 ... 100 ms</text><text x="200" y="310" font-family="Arial,sans-serif" font-size="24" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Retry 2</text><polyline points="350,310 500.0,310" fill="none" stroke="#167D8D" stroke-width="18"/><text x="990" y="310" font-family="Arial,sans-serif" font-size="24" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">0 ... 200 ms</text><text x="200" y="430" font-family="Arial,sans-serif" font-size="24" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Retry 3</text><polyline points="350,430 650.0,430" fill="none" stroke="#167D8D" stroke-width="18"/><text x="990" y="430" font-family="Arial,sans-serif" font-size="24" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">0 ... 400 ms</text><text x="200" y="550" font-family="Arial,sans-serif" font-size="24" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Retry 4</text><polyline points="350,550 950.0,550" fill="none" stroke="#167D8D" stroke-width="18"/><text x="990" y="550" font-family="Arial,sans-serif" font-size="24" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">0 ... 800 ms</text><text x="600" y="690" font-family="Arial,sans-serif" font-size="20" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Full jitter samples within each capped window; it does not guarantee the maximum wait.</text></svg>