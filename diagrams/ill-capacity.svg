<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="100%" height="100%" fill="white"/><text x="600" y="45" font-family="Arial,sans-serif" font-size="30" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">From daily users to concurrent work</text><rect x="175.0" y="112.5" width="850" height="75" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="600" y="150.0" font-family="Arial,sans-serif" font-size="26" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">1M users/day x 20 requests</text><polyline points="600,188 600,225" fill="none" stroke="#536776" stroke-width="3"/><polygon points="600,225 593.9104825224427,212.39374056706254 606.0895174775573,212.39374056706254" fill="#536776"/><rect x="175.0" y="227.5" width="850" height="75" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="600" y="265.0" font-family="Arial,sans-serif" font-size="26" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">20M requests/day / 86400</text><polyline points="600,303 600,340" fill="none" stroke="#536776" stroke-width="3"/><polygon points="600,340 593.9104825224427,327.39374056706254 606.0895174775573,327.39374056706254" fill="#536776"/><rect x="175.0" y="342.5" width="850" height="75" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="600" y="380.0" font-family="Arial,sans-serif" font-size="26" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">231.5 average requests/s</text><polyline points="600,418 600,455" fill="none" stroke="#536776" stroke-width="3"/><polygon points="600,455 593.9104825224427,442.39374056706254 606.0895174775573,442.39374056706254" fill="#536776"/><rect x="175.0" y="457.5" width="850" height="75" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="600" y="495.0" font-family="Arial,sans-serif" font-size="26" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">x8 assumed peak = 1852/s</text><polyline points="600,533 600,570" fill="none" stroke="#536776" stroke-width="3"/><polygon points="600,570 593.9104825224427,557.3937405670625 606.0895174775573,557.3937405670625" fill="#536776"/><rect x="175.0" y="572.5" width="850" height="75" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="600" y="610.0" font-family="Arial,sans-serif" font-size="26" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">x0.2 seconds = 370 in flight</text></svg>