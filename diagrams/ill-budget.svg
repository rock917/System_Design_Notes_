<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="100%" height="100%" fill="white"/><text x="600" y="45" font-family="Arial,sans-serif" font-size="30" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">One request, several latency budgets</text><rect x="122.0" y="240.0" width="56" height="200" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="150.0" y="340.0" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">DNS: 20 ms</text><rect x="182.0" y="240.0" width="176" height="200" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="270.0" y="326.5" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Connect/TLS:</text><text x="270.0" y="353.5" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">60 ms</text><rect x="362.0" y="240.0" width="296" height="200" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="510.0" y="340.0" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Queue: 100 ms</text><rect x="662.0" y="240.0" width="116" height="200" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="720.0" y="340.0" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">App: 40 ms</text><rect x="782.0" y="240.0" width="146" height="200" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="855.0" y="326.5" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Database: 50</text><text x="855.0" y="353.5" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">ms</text><rect x="932.0" y="240.0" width="86" height="200" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="975.0" y="326.5" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Transfer: 30</text><text x="975.0" y="353.5" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">ms</text><text x="600" y="540" font-family="Arial,sans-serif" font-size="28" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Sequential example total: 300 ms</text><text x="600" y="610" font-family="Arial,sans-serif" font-size="22" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">A reused connection may remove setup phases, not all downstream work.</text></svg>