t x="823.3583958711398" y="624.1640786499875" font-family="Arial,sans-serif" font-size="23" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Expired</text><rect x="254.14160412886025" y="579.1640786499875" width="245" height="90" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="376.64160412886025" y="624.1640786499875" font-family="Arial,sans-serif" font-size="23" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Refreshing</text><rect x="116.09852380784162" y="310.83592135001265" width="245" height="90" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="238.59852380784162" y="355.83592135001265" font-family="Arial,sans-serif" font-size="23" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Evicted</text><text x="600" y="110" font-family="Arial,sans-serif" font-size="21" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Start</text><polyline points="600,126 600,145" fill="none" stroke="#536776" stroke-width="3"/><polygon points="600,145 593.9104825224427,132.39374056706254 606.0895174775573,132.39374056706254" fill="#536776"/><text x="600" y="740" font-family="Arial,sans-serif" font-size="24" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Transition triggers and actions</text><text x="100" y="790" font-family="Arial,sans-serif" font-size="23" fill="#153047" font-weight="400" text-anchor="start" dominant-baseline="central">1. Absent -&gt; Refreshing: miss and refresh owner</text><text x="100" y="827" font-family="Arial,sans-serif" font-size="23" fill="#153047" font-weight="400" text-anchor="start" dominant-baseline="central">2. Refreshing -&gt; Fresh: origin result stored</text><text x="100" y="864" font-family="Arial,sans-serif" font-size="23" fill="#153047" font-weight="400" text-anchor="start" dominant-baseline="central">3. Fresh -&gt; Expired: TTL elapsed</text><text x="100" y="901" font-family="Arial,sans-serif" font-size="23" fill="#153047" font-weight="400" text-anchor="start" dominant-baseline="central">4. Expired -&gt; Refreshing: refresh admitted</text><text x="100" y="938" font-family="Arial,sans-serif" font-size="23" fill="#153047" font-weight="400" text-anchor="start" dominant-baseline="central">5. Fresh -&gt; Evicted: capacity eviction</text><text x="100" y="975" font-family="Arial,sans-serif" font-size="23" fill="#153047" font-weight="400" text-anchor="start" dominant-baseline="central">6. Evicted -&gt; Absent: entry unavailable</text></svg>