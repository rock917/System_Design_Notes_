<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="100%" height="100%" fill="white"/><text x="600" y="45" font-family="Arial,sans-serif" font-size="30" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Copies versus divided ownership</text><rect x="100.0" y="185.0" width="280" height="150" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="240" y="260.0" font-family="Arial,sans-serif" font-size="27" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Copy: A B C</text><rect x="460.0" y="185.0" width="280" height="150" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="600" y="260.0" font-family="Arial,sans-serif" font-size="27" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Copy: A B C</text><rect x="820.0" y="185.0" width="280" height="150" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="960" y="260.0" font-family="Arial,sans-serif" font-size="27" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Copy: A B C</text><rect x="100.0" y="465.0" width="280" height="150" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="240" y="540.0" font-family="Arial,sans-serif" font-size="27" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Shard: A</text><rect x="460.0" y="465.0" width="280" height="150" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="600" y="540.0" font-family="Arial,sans-serif" font-size="27" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Shard: B</text><rect x="820.0" y="465.0" width="280" height="150" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="960" y="540.0" font-family="Arial,sans-serif" font-size="27" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Shard: C</text><text x="600" y="130" font-family="Arial,sans-serif" font-size="25" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Replication keeps copies of the same data.</text><text x="600" y="420" font-family="Arial,sans-serif" font-size="25" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Sharding assigns different data to different owners.</text></svg>