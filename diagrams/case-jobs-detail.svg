ly="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">2. Job API -&gt; Job DB + outbox | durable intent</text><text x="70" y="792" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">3. Job DB + outbox -&gt; Broker | publish reference</text><text x="70" y="828" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">4. Broker -&gt; Worker pool | leased work</text><text x="70" y="864" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">5. Worker pool -&gt; Result store | fenced result</text><text x="70" y="900" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">6. Worker pool -&gt; Job DB + outbox | terminal state</text><text x="70" y="936" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">7. Worker pool -&gt; DLQ / reconciler | exhausted failure (control / failure)</text></svg>