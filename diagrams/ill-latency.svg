<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="100%" height="100%" fill="white"/><text x="600" y="45" font-family="Arial,sans-serif" font-size="30" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">How a good mean hides slow requests</text><polyline points="130,610 1100,610" fill="none" stroke="#536776" stroke-width="3"/><polygon points="1100,610 1087.3937405670624,616.0895174775573 1087.3937405670624,603.9104825224427" fill="#536776"/><polyline points="130,610 130,150" fill="none" stroke="#536776" stroke-width="3"/><polygon points="130,150 136.08951747755722,162.60625943293746 123.91048252244278,162.60625943293746" fill="#536776"/><rect x="235.0" y="350.0" width="230" height="260" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="350" y="465.0" font-family="Arial,sans-serif" font-size="25" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">980 requests at</text><text x="350" y="495.0" font-family="Arial,sans-serif" font-size="25" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">20 ms</text><rect x="735.0" y="510.0" width="230" height="100" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="850" y="545.5" font-family="Arial,sans-serif" font-size="24" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">20 requests at</text><text x="850" y="574.5" font-family="Arial,sans-serif" font-size="24" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">2000 ms</text><text x="600" y="120" font-family="Arial,sans-serif" font-size="25" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Mean = 59.6 ms; nearest-rank P99 = 2000 ms</text><text x="600" y="670" font-family="Arial,sans-serif" font-size="20" fill="#536776" font-weight="400" text-anchor="middle" dominant-baseline="central">Schematic population bars; heights are not a linear frequency scale.</text></svg>