" y="535.0" width="310" height="110" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="220" y="590.0" font-family="Arial,sans-serif" font-size="23" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Telemetry</text><rect x="445.0" y="535.0" width="310" height="110" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="600" y="590.0" font-family="Arial,sans-serif" font-size="23" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Backup / recovery</text><rect x="825.0" y="535.0" width="310" height="110" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="980" y="590.0" font-family="Arial,sans-serif" font-size="23" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Identity / secrets</text><ellipse cx="410.0" cy="187.0" rx="13" ry="14" fill="white"/><text x="410.0" y="187.0" font-family="Arial,sans-serif" font-size="24" fill="#167D8D" font-weight="700" text-anchor="middle" dominant-baseline="central">1</text><ellipse cx="790.0" cy="114.0" rx="13" ry="14" fill="white"/><text x="790.0" y="114.0" font-family="Arial,sans-serif" font-size="24" fill="#167D8D" font-weight="700" text-anchor="middle" dominant-baseline="central">2</text><ellipse cx="410.0" cy="275.0" rx="13" ry="14" fill="white"/><text x="410.0" y="275.0" font-family="Arial,sans-serif" font-size="24" fill="#167D8D" font-weight="700" text-anchor="middle" dominant-baseline="central">3</text><ellipse cx="410.0" cy="397.0" rx="13" ry="14" fill="white"/><text x="410.0" y="397.0" font-family="Arial,sans-serif" font-size="24" fill="#167D8D" font-weight="700" text-anchor="middle" dominant-baseline="central">4</text><ellipse cx="790.0" cy="324.0" rx="13" ry="14" fill="white"/><text x="790.0" y="324.0" font-family="Arial,sans-serif" font-size="24" fill="#167D8D" font-weight="700" text-anchor="middle" dominant-baseline="central">5</text><ellipse cx="376.0" cy="416.5" rx="13" ry="14" fill="white"/><text x="376.0" y="416.5" font-family="Arial,sans-serif" font-size="24" fill="#167D8D" font-weight="700" text-anchor="middle" dominant-baseline="central">6</text><ellipse cx="323.5" cy="470.0" rx="13" ry="14" fill="white"/><text x="323.5" y="470.0" font-family="Arial,sans-serif" font-size="24" fill="#167D8D" font-weight="700" text-anchor="middle" dominant-baseline="central">7</text><ellipse cx="790.0" cy="432.5" rx="13" ry="14" fill="white"/><text x="790.0" y="432.5" font-family="Arial,sans-serif" font-size="24" fill="#167D8D" font-weight="700" text-anchor="middle" dominant-baseline="central">8</text><text x="600" y="680" font-family="Arial,sans-serif" font-size="21" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Numbered connections: source -&gt; destination | message or responsibility</text><text x="70" y="720" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">1. Client / CDN -&gt; Gateway + API replicas | HTTPS</text><text x="70" y="756" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">2. Gateway + API replicas -&gt; Cache | catalog lookup</text><text x="70" y="792" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">3. Gateway + API replicas -&gt; Orders DB + outbox | transaction</text><text x="70" y="828" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">4. Orders DB + outbox -&gt; Broker + workers | events</text><text x="70" y="864" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">5. Broker + workers -&gt; Payment provider | operation ID</text><text x="70" y="900" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">6. Gateway + API replicas -&gt; Telemetry | signals (control / failure)</text><text x="70" y="936" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">7. Orders DB + outbox -&gt; Backup / recovery | protected copy</text><text x="70" y="972" font-family="Arial,sans-serif" font-size="21" fill="#536776" font-weight="400" text-anchor="start" dominant-baseline="central">8. Identity / secrets -&gt; Gateway + API replicas | identity (control / failure)</text></svg>