<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750"><rect width="100%" height="100%" fill="white"/><text x="600" y="45" font-family="Arial,sans-serif" font-size="30" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">Circuit breaker failure and recovery timeline</text><polyline points="110,360 1100,360" fill="none" stroke="#536776" stroke-width="3"/><polygon points="1100,360 1087.3937405670624,366.08951747755725 1087.3937405670624,353.91048252244275" fill="#536776"/><text x="190" y="250" font-family="Arial,sans-serif" font-size="27" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">t=0</text><rect x="75.0" y="407.5" width="230" height="125" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="190" y="470.0" font-family="Arial,sans-serif" font-size="24" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">3 failures</text><polyline points="190,300 190,400" fill="none" stroke="#536776" stroke-width="3"/><text x="460" y="250" font-family="Arial,sans-serif" font-size="27" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">t=1</text><rect x="345.0" y="407.5" width="230" height="125" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="460" y="470.0" font-family="Arial,sans-serif" font-size="24" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Fail fast</text><polyline points="460,300 460,400" fill="none" stroke="#536776" stroke-width="3"/><text x="730" y="250" font-family="Arial,sans-serif" font-size="27" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">t=5</text><rect x="615.0" y="407.5" width="230" height="125" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="730" y="470.0" font-family="Arial,sans-serif" font-size="24" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">One probe</text><polyline points="730,300 730,400" fill="none" stroke="#536776" stroke-width="3"/><text x="1000" y="250" font-family="Arial,sans-serif" font-size="27" fill="#153047" font-weight="700" text-anchor="middle" dominant-baseline="central">t=5+</text><rect x="885.0" y="407.5" width="230" height="125" rx="12" fill="#EAF3F6" stroke="#153047" stroke-width="3"/><text x="1000" y="470.0" font-family="Arial,sans-serif" font-size="24" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Close or reopen</text><polyline points="1000,300 1000,400" fill="none" stroke="#536776" stroke-width="3"/><text x="600" y="650" font-family="Arial,sans-serif" font-size="23" fill="#153047" font-weight="400" text-anchor="middle" dominant-baseline="central">Illustrative threshold: 3 failures; cooldown: 5 seconds.</text></svg>